<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EvoStudio — Connexion</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%232563eb'/><path d='M20 4 10.5 13.5M20 4l-6 16-3.5-7-7-3.5z' fill='none' stroke='%23ffffff' stroke-width='1.5' stroke-linejoin='round' stroke-linecap='round'/></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root{--blue:#2563eb;--blue-dark:#1d4ed8;--blue-50:#eff6ff;--blue-100:#dbeafe;--ink:#0f172a;--slate:#64748b;--line:#e2e8f0}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:linear-gradient(180deg,var(--blue-50),#fff);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
    .logo{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;margin-bottom:28px;text-decoration:none;color:var(--ink)}
    .logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--blue),#3b82f6);display:flex;align-items:center;justify-content:center}
    .logo-icon svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.2}
    .logo span{color:var(--blue)}
    .box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:40px;width:100%;max-width:420px;box-shadow:0 12px 40px rgba(37,99,235,.10)}
    h1{font-size:24px;font-weight:800;margin-bottom:6px}
    .sub{font-size:14px;color:var(--slate);margin-bottom:26px}
    label{display:block;font-size:12px;font-weight:700;color:#334155;margin-bottom:7px;margin-top:16px}
    input{width:100%;background:#f8fafc;border:1.5px solid var(--line);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:14px;outline:none;transition:border-color .2s;font-family:inherit}
    input:focus{border-color:var(--blue);background:#fff}
    .btn{width:100%;margin-top:24px;background:var(--blue);color:#fff;border:none;border-radius:11px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit;box-shadow:0 6px 18px rgba(37,99,235,.28)}
    .btn:hover{background:var(--blue-dark)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .msg{font-size:13px;margin-top:12px;min-height:18px;text-align:center}
    .msg.err{color:#dc2626}.msg.ok{color:#16a34a}
    .footer-link{text-align:center;margin-top:22px;font-size:14px;color:var(--slate)}
    .footer-link a{color:var(--blue);text-decoration:none;font-weight:600}
    .footer-link a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <a href="/" class="logo">
    <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/></svg></div>
    Evo<span>Studio</span>
  </a>
  <div class="box">
    <h1>Connexion</h1>
    <p class="sub">Accédez à votre espace client EvoStudio.</p>
    <form id="form">
      <label>Adresse email</label>
      <input type="email" id="email" placeholder="vous@exemple.com" required autofocus />
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" required />
      <button class="btn" type="submit" id="btn">Se connecter</button>
    </form>
    <div class="msg" id="msg"></div>
    <div class="footer-link">Pas encore de compte ? <a href="/register.html">Créer un compte</a></div>
  </div>
  <script>
    const API = 'https://admin.evostudio.fr';
    if (localStorage.getItem('evo_token')) location.href = '/dashboard.html';
    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const msg = document.getElementById('msg'); const btn = document.getElementById('btn');
      btn.disabled = true; btn.textContent = 'Connexion...';
      try {
        const r = await fetch(API + '/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ email, password }) });
        const d = await r.json();
        if (d.ok) {
          localStorage.setItem('evo_token', d.token); localStorage.setItem('evo_email', d.email);
          msg.className='msg ok'; msg.textContent='✓ Connecté ! Redirection...';
          const redir = new URLSearchParams(location.search).get('redirect') || '/dashboard.html';
          setTimeout(() => location.href = redir, 800);
        } else { msg.className='msg err'; msg.textContent = d.error || 'Email ou mot de passe incorrect.'; btn.disabled=false; btn.textContent='Se connecter'; }
      } catch { msg.className='msg err'; msg.textContent='Erreur réseau. Réessayez.'; btn.disabled=false; btn.textContent='Se connecter'; }
    });
  </script>
</body>
</html>
