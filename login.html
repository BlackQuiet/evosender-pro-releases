<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EvoStudio — Connexion</title><meta name="robots" content="noindex, nofollow" /><link rel="icon" href="/logo-EvoSender.ico" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root{--blue:#d29a2b;--blue-dark:#b9831f;--ink:#eef2fb;--slate:#9aa7c2;--line:rgba(255,255,255,.1);--purple:#dcb968}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(120% 80% at 15% 0%,rgba(185,131,31,.18),transparent 55%),radial-gradient(90% 70% at 100% 10%,rgba(169,120,26,.16),transparent 55%),#070a14}
    .auth{width:100%;max-width:400px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);border-radius:18px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.5),0 0 50px rgba(224,169,60,.1);backdrop-filter:blur(10px)}

    .form{padding:14px 38px 40px;display:flex;flex-direction:column}
    @media(max-width:480px){.form{padding:12px 26px 34px}}
    .logo-banner{position:relative;display:flex;justify-content:center;align-items:center;padding:34px 20px 26px;margin:0 -38px 30px;background:linear-gradient(180deg,rgba(224,169,60,.12),transparent);border-bottom:1px solid rgba(255,255,255,.06)}
    @media(max-width:480px){.logo-banner{margin:0 -26px 26px}}
    .home-btn{position:absolute;top:16px;left:16px;display:flex;align-items:center;justify-content:center;width:34px;height:34px;background:rgba(255,255,255,.06);color:var(--slate);text-decoration:none;border-radius:10px;transition:.15s;border:1px solid rgba(255,255,255,.08)}
    .home-btn:hover{background:var(--blue);color:#fff}
    .home-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9}
    .logo-banner img{height:52px;max-width:210px;object-fit:contain}
    h1{font-size:21px;font-weight:700;margin-bottom:5px;letter-spacing:-.3px;text-align:center;color:#fff}
    .sub{font-size:13.5px;color:var(--slate);margin-bottom:26px;text-align:center}
    label{display:block;font-size:11px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px;margin-top:18px}
    .inp{position:relative}
    .inp>svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:#6b7896;fill:none;stroke-width:1.7}
    .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;padding:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px}
    .eye svg{width:17px;height:17px;stroke:#6b7896;fill:none;stroke-width:1.7;transition:stroke .15s}
    .eye:hover svg{stroke:var(--blue)}
    input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:13px 14px 13px 44px;font-size:14px;outline:none;transition:.18s;font-family:inherit}
    input::placeholder{color:#6b7896}
    input:focus{border-color:var(--blue);background:rgba(255,255,255,.06);box-shadow:0 0 0 3px rgba(224,169,60,.15)}
    .btn{width:100%;margin-top:28px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;border:none;border-radius:11px;padding:13px;font-size:14.5px;font-weight:600;cursor:pointer;transition:.18s;font-family:inherit;box-shadow:0 8px 26px rgba(224,169,60,.35)}
    .btn:hover{transform:translateY(-1px)}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .msg{font-size:13px;margin-top:14px;min-height:18px;text-align:center}
    .msg.err{color:#f87171}.msg.ok{color:#34d399}
    .footer-link{text-align:center;margin-top:22px;font-size:13.5px;color:var(--slate)}
    .footer-link a{color:#e6b756;text-decoration:none;font-weight:600}
    .footer-link a:hover{text-decoration:underline}
    /* ═══ MODE CLAIR ═══ */
    html[data-theme="light"]{--blue:#b9831f;--ink:#0f172a;--slate:#475569;--line:#e2e8f0}
    html[data-theme="light"] body{background:radial-gradient(120% 80% at 15% 0%,rgba(185,131,31,.1),transparent 55%),radial-gradient(90% 70% at 100% 10%,rgba(169,120,26,.08),transparent 55%),#f4f7fc}
    html[data-theme="light"] .auth{background:#fff;border-color:#e8ecf2;box-shadow:0 18px 50px rgba(15,23,42,.08)}
    html[data-theme="light"] .logo-banner{background:linear-gradient(180deg,#fff,#f7faff);border-bottom-color:#eef2f7}
    html[data-theme="light"] .home-btn{background:#f3f5f9;border-color:#e2e8f0}
    html[data-theme="light"] h1{color:#0f172a}
    html[data-theme="light"] input{background:#fafbfc;color:#0f172a}
    html[data-theme="light"] input:focus{background:#fff}
    html[data-theme="light"] input::placeholder{color:#94a3b8}
    html[data-theme="light"] .inp>svg,html[data-theme="light"] .eye svg{stroke:#94a3b8}
  </style>
<script src="/theme.js"></script>
  <script>window.I18N_PAGE={
    en:{
      "login.title":"Log in",
      "login.sub":"Access your client area.",
      "login.email_label":"Email address",
      "login.email_ph":"you@example.com",
      "login.pw_label":"Password",
      "login.submit":"Sign in",
      "login.submit_loading":"Signing in...",
      "login.no_account":"No account yet?",
      "login.create_account":"Create account",
      "login.show_pw":"Show password",
      "login.hide_pw":"Hide password",
      "login.2fa_title":"🔐 2FA verification",
      "login.2fa_sub":"Enter the 6-digit code from your authenticator app (Google Authenticator, Authy…).",
      "login.totp_label":"TOTP code",
      "login.2fa_submit":"Verify",
      "login.2fa_loading":"Verifying...",
      "login.back":"← Back to log in",
      "login.msg_connecting":"Signing in...",
      "login.msg_connected":"✓ Signed in! Redirecting...",
      "login.msg_not_verified":"Account not verified — redirecting to confirmation...",
      "login.msg_bad_creds":"Incorrect email or password.",
      "login.msg_bad_code":"Incorrect code.",
      "login.msg_network":"Network error. Try again.",
      "login.home":"Home"
    },
    ru:{
      "login.title":"Вход",
      "login.sub":"Доступ к личному кабинету.",
      "login.email_label":"Адрес email",
      "login.email_ph":"you@example.com",
      "login.pw_label":"Пароль",
      "login.submit":"Войти",
      "login.submit_loading":"Вход...",
      "login.no_account":"Ещё нет аккаунта?",
      "login.create_account":"Создать аккаунт",
      "login.show_pw":"Показать пароль",
      "login.hide_pw":"Скрыть пароль",
      "login.2fa_title":"🔐 Подтверждение 2FA",
      "login.2fa_sub":"Введите 6-значный код из приложения-аутентификатора (Google Authenticator, Authy…).",
      "login.totp_label":"Код TOTP",
      "login.2fa_submit":"Подтвердить",
      "login.2fa_loading":"Проверка...",
      "login.back":"← Назад ко входу",
      "login.msg_connecting":"Вход...",
      "login.msg_connected":"✓ Вход выполнен! Перенаправление...",
      "login.msg_not_verified":"Аккаунт не подтверждён — перенаправление на подтверждение...",
      "login.msg_bad_creds":"Неверный email или пароль.",
      "login.msg_bad_code":"Неверный код.",
      "login.msg_network":"Ошибка сети. Повторите попытку.",
      "login.home":"Главная"
    }
  };</script>
  <script src="/i18n.js" defer></script>
</head>
<body>
  <div class="auth">

    <main class="form">
      <div class="logo-banner"><a href="/" class="home-btn" title="Accueil" aria-label="Accueil" data-i18n-title="login.home" data-i18n-aria="login.home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg></a><img src="/logoevostudio2.png" alt="EvoStudio" /><div id="lang-switch" style="position:absolute;top:16px;right:16px"></div></div>

      <!-- Étape 1 : email + mot de passe -->
      <div id="step-login">
        <h1 data-i18n="login.title">Connexion</h1>
        <p class="sub" data-i18n="login.sub">Accédez à votre espace client.</p>
        <form id="form" autocomplete="off">
          <label data-i18n="login.email_label">Adresse email</label>
          <div class="inp">
            <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg>
            <input type="email" id="email" placeholder="vous@exemple.com" data-i18n-ph="login.email_ph" required autofocus autocomplete="off" />
          </div>
          <label data-i18n="login.pw_label">Mot de passe</label>
          <div class="inp">
            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" placeholder="••••••••" required style="padding-right:42px" autocomplete="new-password" />
            <button type="button" class="eye" aria-label="Afficher le mot de passe" data-i18n-aria="login.show_pw" onclick="togglePw('password',this)"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <button class="btn" type="submit" id="btn" data-i18n="login.submit">Se connecter</button>
        </form>
        <div class="msg" id="msg"></div>
        <div class="footer-link"><span data-i18n="login.no_account">Pas encore de compte ?</span> <a href="/register.html" data-i18n="login.create_account">Créer un compte</a></div>
      </div>

      <!-- Étape 2 : code TOTP (affiché si 2FA activé) -->
      <div id="step-2fa" style="display:none">
        <h1 data-i18n="login.2fa_title">🔐 Vérification 2FA</h1>
        <p class="sub" data-i18n="login.2fa_sub">Entrez le code à 6 chiffres de votre application d'authentification (Google Authenticator, Authy…).</p>
        <form id="form-2fa">
          <label data-i18n="login.totp_label">Code TOTP</label>
          <div class="inp">
            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="text" id="totp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" autocomplete="one-time-code" />
          </div>
          <button class="btn" type="submit" id="btn-2fa" data-i18n="login.2fa_submit">Vérifier</button>
        </form>
        <div class="msg" id="msg-2fa"></div>
        <div class="footer-link"><a href="#" onclick="resetLogin()" data-i18n="login.back">← Retour à la connexion</a></div>
      </div>
    </main>
  </div>
  <script>
    const API = 'https://admin.evostudio.fr';
    const EYE_OPEN  = '<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
    const EYE_OFF   = '<svg viewBox="0 0 24 24"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68M6.61 6.61A13.5 13.5 0 0 0 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61M14.12 14.12A3 3 0 1 1 9.88 9.88"/><path d="m2 2 20 20"/></svg>';
    function togglePw(id, btn){
      const inp = document.getElementById(id);
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      btn.innerHTML = show ? EYE_OFF : EYE_OPEN;
      btn.setAttribute('aria-label', show ? t('login.hide_pw','Masquer le mot de passe') : t('login.show_pw','Afficher le mot de passe'));
    }
    (async function checkAuth(){
      try { const r = await fetch(API + '/api/auth/me', { credentials: 'include' }); if (r.ok) location.href = '/dashboard.html'; } catch {}
    })();
    let _preToken = null;

    // Pré-remplir l'email mémorisé (même navigateur) → focus direct sur le mot de passe
    (function prefillEmail(){
      const saved = localStorage.getItem('evo_email');
      if(!saved) return;
      const emailInp = document.getElementById('email');
      const pwInp    = document.getElementById('password');
      if(emailInp){ emailInp.value = saved; }
      if(pwInp){ setTimeout(() => pwInp.focus(), 50); }
    })();

    function resetLogin() {
      _preToken = null;
      document.getElementById('step-login').style.display = '';
      document.getElementById('step-2fa').style.display = 'none';
      document.getElementById('msg').textContent = '';
      document.getElementById('btn').disabled = false;
      document.getElementById('btn').textContent = t('login.submit','Se connecter');
      return false;
    }

    function isSafeRedirect(url) {
      if (!url || typeof url !== 'string') return false;
      // Doit commencer par / mais pas // ni /\ (évite open redirect via /\evil.com ou //evil.com)
      if (!url.startsWith('/') || url[1] === '/' || url[1] === '\\') return false;
      // Pas de protocole embarqué
      if (/^\/\/|^[a-z]+:/i.test(url)) return false;
      return true;
    }

    function finishLogin(token, email) {
      localStorage.removeItem('evo_token');
      localStorage.setItem('evo_email', email);
      localStorage.setItem('evo_logged_in', '1');
      const msg = document.getElementById('msg') || document.getElementById('msg-2fa');
      msg.className = 'msg ok'; msg.textContent = t('login.msg_connected','✓ Connecté ! Redirection...');
      const _redir = new URLSearchParams(location.search).get('redirect') || '/dashboard.html';
      const redir = isSafeRedirect(_redir) ? _redir : '/dashboard.html';
      setTimeout(() => location.href = redir, 700);
    }

    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const msg = document.getElementById('msg'); const btn = document.getElementById('btn');
      btn.disabled = true; btn.textContent = t('login.submit_loading','Connexion...');
      try {
        const _cl = new AbortController(); const _tl = setTimeout(() => _cl.abort(), 15000);
        const r = await fetch(API + '/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', signal:_cl.signal, body:JSON.stringify({ email, password }) });
        clearTimeout(_tl);
        const d = await r.json();
        if (d.ok && d.requires2fa) {
          _preToken = d.pre_token;
          document.getElementById('step-login').style.display = 'none';
          document.getElementById('step-2fa').style.display = '';
          setTimeout(() => document.getElementById('totp').focus(), 100);
        } else if (d.ok) {
          finishLogin(d.token, d.email);
        } else if (d.needVerification) {
          msg.className='msg ok'; msg.textContent=t('login.msg_not_verified','Compte non vérifié — redirection vers la confirmation...');
          setTimeout(() => location.href = '/verify.html?email=' + encodeURIComponent(d.email || email), 800);
        } else {
          msg.className='msg err'; msg.textContent = d.error || t('login.msg_bad_creds','Email ou mot de passe incorrect.');
          btn.disabled=false; btn.textContent=t('login.submit','Se connecter');
        }
      } catch { msg.className='msg err'; msg.textContent=t('login.msg_network','Erreur réseau. Réessayez.'); btn.disabled=false; btn.textContent=t('login.submit','Se connecter'); }
    });

    document.getElementById('form-2fa').addEventListener('submit', async e => {
      e.preventDefault();
      const totp = document.getElementById('totp').value.trim();
      const msg = document.getElementById('msg-2fa'); const btn = document.getElementById('btn-2fa');
      btn.disabled = true; btn.textContent = t('login.2fa_loading','Vérification...');
      try {
        const _c2 = new AbortController(); const _t2 = setTimeout(() => _c2.abort(), 15000);
        const r = await fetch(API + '/api/auth/2fa/verify', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', signal:_c2.signal, body:JSON.stringify({ pre_token: _preToken, totp }) });
        clearTimeout(_t2);
        const d = await r.json();
        if (d.ok) {
          finishLogin(d.token, d.email);
        } else {
          msg.className='msg err'; msg.textContent = d.error || t('login.msg_bad_code','Code incorrect.');
          btn.disabled=false; btn.textContent=t('login.2fa_submit','Vérifier');
          document.getElementById('totp').value = '';
          document.getElementById('totp').focus();
        }
      } catch { msg.className='msg err'; msg.textContent=t('login.msg_network','Erreur réseau.'); btn.disabled=false; btn.textContent=t('login.2fa_submit','Vérifier'); }
    });

    // Ré-applique le libellé des boutons au changement de langue (états au repos)
    window.addEventListener('evo-langchange', function(){
      var b = document.getElementById('btn');
      if (b && !b.disabled) b.textContent = t('login.submit','Se connecter');
      var b2 = document.getElementById('btn-2fa');
      if (b2 && !b2.disabled) b2.textContent = t('login.2fa_submit','Vérifier');
    });
  </script>
<script src="/assistance.js" defer></script>
</body>
</html>
