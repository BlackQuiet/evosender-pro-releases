<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EvoStudio — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#06080f;color:#f0f4ff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
    .logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;margin-bottom:32px;text-decoration:none;color:#f0f4ff}
    .logo-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#1a3a8f,#3b68d8);display:flex;align-items:center;justify-content:center}
    .logo-icon svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2}
    .logo span{color:#3b82f6}
    .box{background:#0d111e;border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:40px;width:100%;max-width:420px;box-shadow:0 24px 80px rgba(0,0,0,.5)}
    h1{font-size:22px;font-weight:800;margin-bottom:6px}
    .sub{font-size:13px;color:#64748b;margin-bottom:28px}
    label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#475569;margin-bottom:6px;margin-top:16px}
    input{width:100%;background:#070b14;border:1px solid rgba(255,255,255,.08);color:#f0f4ff;border-radius:9px;padding:12px 14px;font-size:14px;outline:none;transition:border-color .2s;font-family:inherit}
    input:focus{border-color:#3b82f6}
    .btn{width:100%;margin-top:24px;background:#3b82f6;color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit}
    .btn:hover{background:#1d4ed8}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .msg{font-size:13px;margin-top:12px;min-height:18px;text-align:center}
    .msg.err{color:#ef4444}
    .msg.ok{color:#10b981}
    .footer-link{text-align:center;margin-top:20px;font-size:13px;color:#475569}
    .footer-link a{color:#3b82f6;text-decoration:none}
    .footer-link a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <a href="/" class="logo">
    <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/></svg></div>
    Evo<span>Studio</span>
  </a>

  <div class="box">
    <h1>Connexion</h1>
    <p class="sub">Accédez à votre espace client EvoStudio.</p>

    <form id="form">
      <label>Adresse email</label>
      <input type="email" id="email" placeholder="vous@exemple.com" required autofocus />
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" required />
      <button class="btn" type="submit" id="btn">Se connecter</button>
    </form>
    <div class="msg" id="msg"></div>
    <div class="footer-link">Pas encore de compte ? <a href="/register.html">Créer un compte</a></div>
  </div>

  <script>
    const API = 'https://admin.evostudio.fr';
    if (localStorage.getItem('evo_token')) location.href = '/dashboard.html';

    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const msg      = document.getElementById('msg');
      const btn      = document.getElementById('btn');

      btn.disabled = true; btn.textContent = 'Connexion...';
      try {
        const r = await fetch(API + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const d = await r.json();
        if (d.ok) {
          localStorage.setItem('evo_token', d.token);
          localStorage.setItem('evo_email', d.email);
          msg.className='msg ok'; msg.textContent='✓ Connecté ! Redirection...';
          const redir = new URLSearchParams(location.search).get('redirect') || '/dashboard.html';
          setTimeout(() => location.href = redir, 800);
        } else {
          msg.className='msg err'; msg.textContent = d.error || 'Email ou mot de passe incorrect.';
          btn.disabled = false; btn.textContent = 'Se connecter';
        }
      } catch { msg.className='msg err'; msg.textContent='Erreur réseau. Réessayez.'; btn.disabled=false; btn.textContent='Se connecter'; }
    });
  </script>
</body>
</html>
