<style>
  :root{--blue:#3b82f6;--blue-dark:#2563eb;--ink:#eef2fb;--slate:#9aa7c2;--slate-2:#6b7896;--line:rgba(255,255,255,.09);--green:#34d399;--cyan:#22d3ee;--purple:#a78bfa}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;background:radial-gradient(120% 70% at 12% -5%,rgba(37,99,235,.16),transparent 55%),radial-gradient(90% 60% at 100% 0%,rgba(124,58,237,.14),transparent 55%),#070a14;background-attachment:fixed}
  a{color:inherit}
  .nav{position:sticky;top:0;z-index:50;background:rgba(7,10,20,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 22px}
  .nav .logo img{display:block;height:34px;max-width:150px;object-fit:contain}
  .nav .right{display:flex;gap:8px;align-items:center}
  .btn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:10px 18px;font-size:13.5px;font-weight:600;text-decoration:none;cursor:pointer;border:none;font-family:inherit;transition:.15s}
  .btn-primary{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;box-shadow:0 8px 26px rgba(59,130,246,.35)}.btn-primary:hover{transform:translateY(-1px)}
  .btn-ghost{background:rgba(255,255,255,.05);color:#dfe6f4;border:1px solid var(--line)}.btn-ghost:hover{color:#fff;background:rgba(255,255,255,.09)}
  .wrap{max-width:1060px;margin:0 auto;padding:34px 20px 70px}
  .crumb{font-size:13px;color:var(--slate);margin-bottom:20px}.crumb a{color:#60a5fa;text-decoration:none}
  .hero{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:center}
  @media(max-width:820px){.hero{grid-template-columns:1fr;gap:24px}}
  .shot{border-radius:16px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08),0 0 60px rgba(59,130,246,.12)}
  .shot img{display:block;width:100%;height:auto}
  .badge{display:inline-flex;align-items:center;gap:7px;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.25);color:#7dd3fc;font-weight:700;font-size:11px;padding:4px 12px;border-radius:999px;margin-bottom:14px}
  h1{font-size:34px;font-weight:900;letter-spacing:-.6px;line-height:1.1;margin-bottom:12px;color:#fff}
  @media(max-width:820px){h1{font-size:27px}}
  .desc{font-size:15px;color:var(--slate);line-height:1.65;margin-bottom:22px}
  .price{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
  .price .amount{font-size:34px;font-weight:900;color:#fff}
  .price .old{font-size:18px;color:var(--slate-2);text-decoration:line-through;font-weight:600}
  .price .cur{font-size:15px;color:var(--slate);font-weight:700}
  .price-sub{font-size:12.5px;color:var(--slate);margin-bottom:20px}
  .cta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .sec{margin-top:54px}
  .sec h2{font-size:20px;font-weight:800;margin-bottom:18px;color:#fff}
  .feats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:620px){.feats{grid-template-columns:1fr}}
  .feat{display:flex;gap:11px;align-items:flex-start;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .feat svg{width:20px;height:20px;stroke:var(--cyan);fill:none;stroke-width:2.4;flex-shrink:0;margin-top:1px}
  .feat span{font-size:14px;color:var(--slate);line-height:1.5}
  .other{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:760px){.other{grid-template-columns:1fr}}
  .ocard{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none;transition:.15s}
  .ocard:hover{border-color:rgba(59,130,246,.4);box-shadow:0 12px 30px rgba(59,130,246,.12)}
  .ocard .on{font-weight:800;font-size:15px;margin-bottom:4px;color:#fff}
  .ocard .od{font-size:12.5px;color:var(--slate);line-height:1.5}
  .loading{text-align:center;padding:60px;color:var(--slate)}
  .footer{text-align:center;font-size:12px;color:var(--slate-2);padding:26px}
  /* Détails complets produit */
  .det-block{margin-top:44px}
  .det-block h2{font-size:21px;font-weight:800;margin-bottom:14px;color:#fff}
  .det-block h3{font-size:15.5px;font-weight:700;margin:20px 0 8px;color:#dbe4f5}
  .det-block p{font-size:14.5px;color:var(--slate);line-height:1.72;margin-bottom:12px}
  .det-block ul{list-style:none;margin:0 0 12px;padding:0}
  .det-block li{position:relative;padding-left:24px;font-size:14px;color:var(--slate);line-height:1.6;margin-bottom:8px}
  .det-block li:before{content:"";position:absolute;left:3px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--cyan)}
  .det-block b{color:#e7edf8}
  .steps{display:grid;gap:11px;margin:8px 0 12px;counter-reset:s}
  .step{position:relative;padding:13px 16px 13px 52px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;font-size:14px;color:var(--slate);line-height:1.55}
  .step:before{counter-increment:s;content:counter(s);position:absolute;left:13px;top:12px;width:26px;height:26px;border-radius:8px;background:rgba(59,130,246,.15);color:#7dd3fc;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
  .step b{color:#e7edf8;font-weight:700}
  .uc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
  @media(max-width:620px){.uc-grid{grid-template-columns:1fr}}
  .uc{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .uc .uct{font-weight:700;color:#fff;font-size:14px;margin-bottom:4px}
  .uc .ucd{font-size:13px;color:var(--slate);line-height:1.5}
  /* ═══ MODE CLAIR ═══ */
  html[data-theme="light"]{--blue:#2563eb;--ink:#0f172a;--slate:#475569;--slate-2:#94a3b8;--line:#e6ebf3;--green:#16a34a}
  html[data-theme="light"] body{background:radial-gradient(120% 70% at 12% -5%,rgba(37,99,235,.07),transparent 55%),radial-gradient(90% 60% at 100% 0%,rgba(124,58,237,.05),transparent 55%),#f4f7fc}
  html[data-theme="light"] .nav{background:rgba(255,255,255,.88)}
  html[data-theme="light"] .btn-ghost{background:#fff;color:#475569;border-color:#e2e8f0}
  html[data-theme="light"] .btn-ghost:hover{color:#0f172a;background:#f8fafc}
  html[data-theme="light"] h1,html[data-theme="light"] .sec h2,html[data-theme="light"] .price .amount,html[data-theme="light"] .ocard .on{color:#0f172a}
  html[data-theme="light"] .badge{background:#eff6ff;border-color:#dbeafe;color:#2563eb}
  html[data-theme="light"] .feat,html[data-theme="light"] .ocard{background:#fff}
  html[data-theme="light"] .feat span{color:#334155}
  html[data-theme="light"] .shot{box-shadow:0 30px 70px rgba(15,23,42,.15),0 0 0 1px #e2e8f0}
  html[data-theme="light"] .det-block h2,html[data-theme="light"] .det-block h3,html[data-theme="light"] .uc .uct,html[data-theme="light"] .det-block b,html[data-theme="light"] .step b{color:#0f172a}
  html[data-theme="light"] .det-block p,html[data-theme="light"] .det-block li,html[data-theme="light"] .step,html[data-theme="light"] .uc .ucd{color:#334155}
  html[data-theme="light"] .step,html[data-theme="light"] .uc{background:#fff}
</style>

<script>
const API='https://admin.evostudio.fr';
const IMG={extractor:'/EvoExtractor.png',sender:'/EvoSender.png',verifier:'/Evoverif.png',suite:'/Hub.png'};
const LABEL_FR={extractor:'Collecte d\'adresses email',sender:'Envoi en masse',verifier:'Vérification de listes',suite:'Suite complète'};
function labelFor(id){return t('prod.label.'+id,LABEL_FR[id]||t('prod.label.default','Outil EvoStudio'));}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function qs(k){return new URLSearchParams(location.search).get(k);}
if(localStorage.getItem('evo_token')||localStorage.getItem('evo_logged_in')){var a=document.getElementById('nav-account'),l=document.getElementById('nav-login');if(a)a.style.display='';if(l)l.style.display='none';}

let SHOP_DATA=null;              // données /api/shop/products (hors périmètre i18n)

// ── Détails complets par produit (FR = source ; en/ru ajoutés par traduction) ──
const DETAILS={
  extractor:{ fr:`<div class="det-block">
    <h2>Ce que fait EvoExtractor</h2>
    <p><b>EvoExtractor</b> collecte automatiquement des adresses email professionnelles depuis de multiples sources, <b>100 % sur votre ordinateur</b> — aucune donnée n'est envoyée en ligne. Vous partez de mots-clés ou de fichiers, l'outil parcourt les sources, extrait les adresses, les nettoie (doublons, format) et vous les exporte prêtes à l'emploi.</p>
    <h3>Sources d'extraction</h3>
    <ul>
      <li><b>Web par mots-clés</b> — moteurs de recherche (Google, Bing) et Brave Search API : saisissez un secteur ou un mot-clé, le crawler collecte les emails des sites correspondants.</li>
      <li><b>Fichiers locaux</b> — TXT, CSV, XLSX, PDF, DOCX, HTML : EvoExtractor lit vos fichiers et en extrait toutes les adresses.</li>
      <li><b>Comptes IMAP</b> — connectez une boîte mail et récupérez les adresses de vos emails reçus et envoyés.</li>
      <li><b>URLs & sites</b> — fournissez une liste d'URLs pour en extraire les contacts.</li>
    </ul>
    <h3>Ciblage & nettoyage</h3>
    <ul>
      <li>Filtrage par <b>pays / région</b> et par mots-clés.</li>
      <li><b>Déduplication</b> automatique et exclusions (domaines et motifs à ignorer).</li>
      <li>Historique complet des extractions.</li>
    </ul>
    <h3>Comment ça marche</h3>
    <div class="steps">
      <div class="step">Choisissez la source (mots-clés web, fichiers, IMAP) et vos critères.</div>
      <div class="step">Lancez la recherche : l'extraction se fait <b>en temps réel</b>, avec le compteur d'adresses trouvées.</div>
      <div class="step">EvoExtractor nettoie et <b>dédoublonne</b> automatiquement les résultats.</div>
      <div class="step">Exportez en <b>CSV, TXT ou JSON</b> — prêt pour EvoVerify ou EvoSender.</div>

    <div class="uc-grid">
      <div class="uc"><div class="uct">Prospection B2B</div><div class="ucd">Constituez des listes ciblées par secteur et par pays.</div></div>
      <div class="uc"><div class="uct">Constitution de base</div><div class="ucd">Rassemblez vos contacts éparpillés (fichiers, boîtes mail).</div></div>
      <div class="uc"><div class="uct">Veille & recherche</div><div class="ucd">Collectez les contacts d'un marché ou d'une zone géographique.</div></div>
      <div class="uc"><div class="uct">Alimenter une campagne</div><div class="ucd">Envoyez directement les listes vers EvoSender.</div></div>
    </div>
  </div>`,
  en:`<div class="det-block">
    <h2>What EvoExtractor does</h2>
    <p><b>EvoExtractor</b> automatically collects professional email addresses from multiple sources, <b>100% on your computer</b> — no data is ever sent online. Start from keywords or files, the tool scans the sources, extracts the addresses, cleans them (duplicates, format) and exports them ready to use.</p>
    <h3>Extraction sources</h3>
    <ul>
      <li><b>Web by keywords</b> — search engines (Google, Bing) and Brave Search API: enter an industry or keyword, the crawler collects emails from matching sites.</li>

      <li><b>IMAP accounts</b> — connect a mailbox and retrieve the addresses from your received and sent emails.</li>

      <li>Filtering by <b>country / region</b> and by keywords.</li>

    <div class="steps">

      <div class="step">EvoExtractor automatically cleans and <b>deduplicates</b> the results.</div>
      <div class="step">Export as <b>CSV, TXT or JSON</b> — ready for EvoVerify or EvoSender.</div>
    </div>
    <h3>Use cases</h3>
    <div class="uc-grid">
      <div class="uc"><div class="uct">B2B prospecting</div><div class="ucd">Build targeted lists by industry and country.</div></div>
      <div class="uc"><div class="uct">Database building</div><div class="ucd">Gather your scattered contacts (files, mailboxes).</div></div>
      <div class="uc"><div class="uct">Market research</div><div class="ucd">Collect contacts from a market or geographic area.</div></div>
      <div class="uc"><div class="uct">Fuel a campaign</div><div class="ucd">Send lists directly to EvoSender.</div></div>
    </div>
  </div>`,

  sender:{ fr:`<div class="det-block">
    <h2>Ce que fait EvoSender</h2>
    <p><b>EvoSender</b> envoie vos campagnes email en masse avec une <b>haute délivrabilité</b>, en faisant tourner plusieurs serveurs SMTP (et, en option, des proxys résidentiels) pour protéger votre réputation d'expéditeur. Tout tourne en local : vos listes ne quittent jamais votre machine.</p>
    <h3>Fonctionnalités clés</h3>
    <ul>
      <li><b>Rotation multi-SMTP</b> — répartit les envois sur plusieurs serveurs pour éviter les limites et améliorer la délivrabilité.</li>
      <li><b>Envoi via proxy</b> — modes SMTP-over-proxy et hybride pour masquer votre IP.</li>
      <li><b>Éditeur HTML + modèles</b> et <b>personnalisation</b> (prénom, nom, champs sur mesure) par contact.</li>
      <li><b>Groupes de campagne</b> — sujets, noms d'expéditeur, Reply-To, pièces jointes et lettre réutilisables ; <b>adresse témoin</b> pour recevoir une copie.</li>
      <li><b>Suivi</b> des ouvertures et des clics via un domaine de tracking dédié.</li>
      <li><b>Gestion des retours</b> (rebonds / auto-réponses) et <b>désinscription</b> conforme, activable ou désactivable.</li>
      <li><b>Rapports PDF</b> de campagne, <b>mode anti-spam</b> et <b>mode image</b>.</li>
    </ul>
    <h3>Comment ça marche</h3>

  en:`<div class="det-block">

  verifier:{ fr:`<div class="det-block">

    <div class="steps">

    <h3>Cas d'usage</h3>
    <div class="uc-grid">
      <div class="uc"><div class="uct">Nettoyer une liste</div><div class="ucd">Retirez les adresses invalides avant campagne.</div></div>
      <div class="uc"><div class="uct">Réduire les rebonds</div><div class="ucd">Moins de bounces = meilleure réputation d'envoi.</div></div>

  en:`<div class="det-block">
    <h2>What EvoVerify does</h2>
    <p><b>EvoVerify</b> checks the existence and validity of your email addresses <b>before sending</b>, to eliminate dead addresses, reduce bounces and protect your sender reputation. 100% local verification, with no limit.</p>

    <h2>Что делает EvoVerify</h2>

};
function detailsFor(id){ var d=DETAILS[id]; if(!d) return ''; var lg=(window.getLang?window.getLang():'fr'); return d[lg]||d.fr||''; }

function renderError(msgKey,frMsg,linkHref,linkKey,frLink){
  document.getElementById('content').innerHTML=
    '<div class="loading">'+esc(t(msgKey,frMsg))+' <a href="'+linkHref+'" style="color:#2563eb">'+esc(t(linkKey,frLink))+'</a></div>';
}

function renderProduct(){
  const id=PROD_ID;
  if(!SHOP_DATA) return;
  const data=SHOP_DATA;
  const products=Array.isArray(data.products)?data.products:[];
  const p=products.find(x=>x.id===id);
  if(!p){ renderError('prod.err_notfound','Produit introuvable.','/#produits','prod.err_see_all','Voir tous les produits'); return; }

  const disc=Number(data.discount_pct)||0;
  const newPrice=disc>0?Math.round(p.price_usdt*(1-disc/100)*100)/100:p.price_usdt;
  const priceHtml=disc>0
    ? '<span class="amount">'+newPrice+'</span><span class="old">'+p.price_usdt+'</span><span class="cur">USDT</span>'
    : '<span class="amount">'+p.price_usdt+'</span><span class="cur">USDT</span>';
  const xof=p.price_wave?(' · '+Number(disc>0?Math.round(p.price_wave*(1-disc/100)):p.price_wave).toLocaleString('fr-FR')+' XOF'):'';
  const btc=p.price_btc?(' · '+p.price_btc+' BTC'):'';
  const feats=Array.isArray(p.features)?p.features:[];
  const check='<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';

  const others=products.filter(x=>x.id!==id);
  const othersHtml=others.map(function(o){return '<a class="ocard" href="/produit.html?id='+esc(o.id)+'"><div class="on">'+esc(o.name)+'</div><div class="od">'+esc(o.description||labelFor(o.id))+'</div></a>';}).join('');

  document.title='EvoStudio — '+p.name;
  document.getElementById('content').innerHTML=
    '<div class="crumb"><a href="/">'+esc(t('prod.crumb.home','Accueil'))+'</a> › <a href="/#produits">'+esc(t('prod.crumb.products','Produits'))+'</a> › '+esc(p.name)+'</div>'+
    '<div class="hero">'+
      '<div class="shot"><img src="'+(IMG[id]||IMG.sender)+'" alt="'+esc(p.name)+'" /></div>'+
      '<div>'+
        '<div class="badge">● '+esc(labelFor(id))+'</div>'+
        '<h1>'+esc(p.name)+'</h1>'+
        '<p class="desc">'+esc(p.description||'')+'</p>'+
        '<div class="price">'+priceHtml+(disc>0?' <span style="background:#dc2626;color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px">-'+disc+'%</span>':'')+'</div>'+
        '<div class="price-sub">'+esc(t('prod.license','Licence annuelle (1 an)'))+btc+xof+'</div>'+
        '<div class="cta"><a class="btn btn-primary" style="padding:13px 26px;font-size:15px" href="/pay.html?product='+esc(id)+'">'+esc(t('prod.buy_now','Acheter maintenant →'))+'</a><a class="btn btn-ghost" style="padding:13px 22px" href="/login.html">'+esc(t('prod.have_account','J\'ai déjà un compte'))+'</a></div>'+
      '</div>'+
    '</div>'+
    (feats.length?('<div class="sec"><h2>'+esc(t('prod.features','✨ Fonctionnalités'))+'</h2><div class="feats">'+feats.map(function(f){return '<div class="feat">'+check+'<span>'+esc(f)+'</span></div>';}).join('')+'</div></div>'):'')+
    detailsFor(id)+
    '<div class="sec"><h2>'+esc(t('prod.other_tools','Les autres outils EvoStudio'))+'</h2><div class="other">'+othersHtml+'</div></div>';
}

// Re-render le contenu généré en JS quand la langue change
window.addEventListener('evo-langchange',renderProduct);

(async function(){
  try{ const r=await fetch(API+'/api/shop/products'); SHOP_DATA=await r.json(); }
  catch(e){ renderError('prod.err_load','Impossible de charger le produit.','/','prod.err_back_home','Retour à l\'accueil'); return; }
  renderProduct();
})();
</script>
