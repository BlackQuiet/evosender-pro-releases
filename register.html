<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EvoStudio — Créer un compte</title><link rel="icon" href="/logo-EvoSender.ico" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root{--blue:#3b82f6;--blue-dark:#2563eb;--ink:#eef2fb;--slate:#9aa7c2;--line:rgba(255,255,255,.1);--purple:#a78bfa}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(120% 80% at 15% 0%,rgba(37,99,235,.18),transparent 55%),radial-gradient(90% 70% at 100% 10%,rgba(124,58,237,.16),transparent 55%),#070a14}
    .auth{width:100%;max-width:400px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);border-radius:18px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.5),0 0 50px rgba(59,130,246,.1);backdrop-filter:blur(10px)}
    .form{padding:14px 38px 40px;display:flex;flex-direction:column}
    @media(max-width:480px){.form{padding:12px 26px 34px}}
    .logo-banner{position:relative;display:flex;justify-content:center;align-items:center;padding:34px 20px 26px;margin:0 -38px 30px;background:linear-gradient(180deg,rgba(59,130,246,.12),transparent);border-bottom:1px solid rgba(255,255,255,.06)}
    @media(max-width:480px){.logo-banner{margin:0 -26px 26px}}
    .home-btn{position:absolute;top:16px;left:16px;display:flex;align-items:center;justify-content:center;width:34px;height:34px;background:rgba(255,255,255,.06);color:var(--slate);text-decoration:none;border-radius:10px;transition:.15s;border:1px solid rgba(255,255,255,.08)}
    .home-btn:hover{background:var(--blue);color:#fff}
    .home-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9}
    .logo-banner img{height:52px;max-width:210px;object-fit:contain}
    h1{font-size:21px;font-weight:700;margin-bottom:5px;letter-spacing:-.3px;text-align:center;color:#fff}
    .sub{font-size:13.5px;color:var(--slate);margin-bottom:26px;text-align:center}
    label{display:block;font-size:11px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px;margin-top:18px}
    .inp{position:relative}
    .inp>svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:#6b7896;fill:none;stroke-width:1.7}
    .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;padding:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px}
    .eye svg{width:17px;height:17px;stroke:#6b7896;fill:none;stroke-width:1.7;transition:stroke .15s}
    .eye:hover svg{stroke:var(--blue)}
    input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:13px 14px 13px 44px;font-size:14px;outline:none;transition:.18s;font-family:inherit}
    input::placeholder{color:#6b7896}
    input:focus{border-color:var(--blue);background:rgba(255,255,255,.06);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
    .btn{width:100%;margin-top:28px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;border:none;border-radius:11px;padding:13px;font-size:14.5px;font-weight:600;cursor:pointer;transition:.18s;font-family:inherit;box-shadow:0 8px 26px rgba(59,130,246,.35)}
    .btn:hover{transform:translateY(-1px)}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .msg{font-size:13px;margin-top:14px;min-height:18px;text-align:center}
    .msg.err{color:#f87171}.msg.ok{color:#34d399}
    .footer-link{text-align:center;margin-top:22px;font-size:13.5px;color:var(--slate)}
    .footer-link a{color:#60a5fa;text-decoration:none;font-weight:600}
    .footer-link a:hover{text-decoration:underline}
    /* ═══ MODE CLAIR ═══ */
    html[data-theme="light"]{--blue:#2563eb;--ink:#0f172a;--slate:#475569;--line:#e2e8f0}
    html[data-theme="light"] body{background:radial-gradient(120% 80% at 15% 0%,rgba(37,99,235,.1),transparent 55%),radial-gradient(90% 70% at 100% 10%,rgba(124,58,237,.08),transparent 55%),#f4f7fc}
    html[data-theme="light"] .auth{background:#fff;border-color:#e8ecf2;box-shadow:0 18px 50px rgba(15,23,42,.08)}
    html[data-theme="light"] .logo-banner{background:linear-gradient(180deg,#fff,#f7faff);border-bottom-color:#eef2f7}
    html[data-theme="light"] .home-btn{background:#f3f5f9;border-color:#e2e8f0}
    html[data-theme="light"] h1{color:#0f172a}
    html[data-theme="light"] input{background:#fafbfc;color:#0f172a}
    html[data-theme="light"] input:focus{background:#fff}
    html[data-theme="light"] input::placeholder{color:#94a3b8}
    html[data-theme="light"] .inp>svg,html[data-theme="light"] .eye svg{stroke:#94a3b8}
  </style>
<script src="/theme.js"></script>
</head>
<body>
  <div class="auth">
    <main class="form">
      <div class="logo-banner"><a href="/" class="home-btn" title="Accueil" aria-label="Accueil"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg></a><img src="/logoevostudio2.png" alt="EvoStudio" /></div>
      <h1>Créer un compte</h1>
      <p class="sub">Accédez à vos licences après achat.</p>
      <form id="form" autocomplete="off">
        <label>Adresse email</label>
        <div class="inp">
          <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg>
          <input type="email" id="email" placeholder="vous@exemple.com" required autofocus autocomplete="off" />
        </div>
        <label>Mot de passe</label>
        <div class="inp">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="password" placeholder="Min. 8 car., 1 majuscule, 1 chiffre" required style="padding-right:42px" autocomplete="new-password" />
          <button type="button" class="eye" aria-label="Afficher le mot de passe" onclick="togglePw('password',this)"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <label>Confirmer le mot de passe</label>
        <div class="inp">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="password2" placeholder="Répéter le mot de passe" required style="padding-right:42px" autocomplete="new-password" />
          <button type="button" class="eye" aria-label="Afficher le mot de passe" onclick="togglePw('password2',this)"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <button class="btn" type="submit" id="btn">Créer mon compte</button>
      </form>
      <div class="msg" id="msg"></div>
      <div class="footer-link">Déjà un compte ? <a href="/login.html">Se connecter</a></div>
    </main>
  </div>
  <script>
    const API = 'https://admin.evostudio.fr';
    const EYE_OPEN  = '<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
    const EYE_OFF   = '<svg viewBox="0 0 24 24"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68M6.61 6.61A13.5 13.5 0 0 0 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61M14.12 14.12A3 3 0 1 1 9.88 9.88"/><path d="m2 2 20 20"/></svg>';
    function togglePw(id, btn){
      const inp = document.getElementById(id);
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      btn.innerHTML = show ? EYE_OFF : EYE_OPEN;
      btn.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
    }
    function isSafeRedirect(url) {
      if (!url || typeof url !== 'string') return false;
      if (!url.startsWith('/') || url[1] === '/' || url[1] === '\\') return false;
      if (/^\/\/|^[a-z]+:/i.test(url)) return false;
      return true;
    }

    (async function checkAuth(){
      try { const r = await fetch(API + '/api/auth/me', { credentials: 'include' }); if (r.ok) location.href = '/dashboard.html'; } catch {}
    })();
    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      const msg = document.getElementById('msg'); const btn = document.getElementById('btn');
      if (password.length < 8) { msg.className='msg err'; msg.textContent='Le mot de passe doit contenir au moins 8 caractères.'; return; }
      if (password.length > 72) { msg.className='msg err'; msg.textContent='Le mot de passe est trop long (max 72 caractères).'; return; }
      if (!/[A-Z]/.test(password) || !/[0-9]/.test(password)) { msg.className='msg err'; msg.textContent='Le mot de passe doit contenir au moins une majuscule et un chiffre.'; return; }
      if (password !== password2) { msg.className='msg err'; msg.textContent='Les mots de passe ne correspondent pas.'; return; }
      btn.disabled = true; btn.textContent = 'Création...';
      try {
        const _cr = new AbortController(); const _tr = setTimeout(() => _cr.abort(), 15000);
        const r = await fetch(API + '/api/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', signal:_cr.signal, body:JSON.stringify({ email, password }) });
        clearTimeout(_tr);
        const d = await r.json();
        if (d.ok) {
          // Le compte est créé mais NON actif : il faut confirmer l'email (code + lien envoyés).
          localStorage.setItem('evo_email', d.email);
          msg.className='msg ok'; msg.textContent='✓ Compte créé ! Vérification de l\'email...';
          const _redir = new URLSearchParams(location.search).get('redirect');
          const q = '?email=' + encodeURIComponent(d.email) + (isSafeRedirect(_redir) ? '&redirect=' + encodeURIComponent(_redir) : '');
          setTimeout(() => location.href = '/verify.html' + q, 700);
        } else { msg.className='msg err'; msg.textContent = d.error || 'Erreur lors de la création.'; btn.disabled=false; btn.textContent='Créer mon compte'; }
      } catch { msg.className='msg err'; msg.textContent='Erreur réseau. Réessayez.'; btn.disabled=false; btn.textContent='Créer mon compte'; }
    });
  </script>
<script src="/assistance.js" defer></script>
</body>
</html>
